<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#EEEEF1" />
    <script>
      // Aplica el tema guardado antes de pintar (evita el destello). El portal es siempre claro.
      try {
        var t = localStorage.getItem('em.panel.tema')
        var panel = location.pathname.indexOf('/admin') === 0
        var oscuro = panel && (t ? t === 'oscuro' : matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = oscuro ? 'dark' : 'light'
      } catch (e) {}
    </script>
    <meta name="description" content="Pasajes de bus Sucre, Santa Cruz, Tarija y La Paz. Compra en línea, rastrea tu encomienda y consulta horarios de TransDemo." />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>TransDemo · Pasajes de bus, carga y encomiendas</title>
  </head>
  <body>
    <noscript>Activa JavaScript para usar TransDemo.</noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
